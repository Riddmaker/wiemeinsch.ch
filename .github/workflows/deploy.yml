# CI/CD-Pipeline für wiemeinsch.ch.
#
# Kette: Qualität → E2E → Image bauen & signieren → Signatur prüfen und
# Redeploy über die Jelastic-API (redeploy.yml, geteilt mit rollback.yml).
# Schlägt eine Stufe fehl, wird KEIN Image publiziert und nichts deployed.
#
# Action-Versionen sind exakt gepinnt und am 02.09.2026 gegen die jeweils
# aktuellen Releases der Hersteller geprüft (HABIT 4). Nächste Härtungsstufe
# wäre das Pinnen auf Commit-SHAs (Dependabot kann beides aktuell halten).
name: Deploy

on:
  push:
    branches: [main]
  # Erlaubt einen Redeploy des unveränderten Standes ohne Leer-Commit. Von
  # einem anderen Branch gestartet, laufen nur die Prüfungen: Build und Push
  # sind an main gebunden (siehe build-push).
  workflow_dispatch:

# Zwei gleichzeitige Deployments derselben Umgebung wären ein Rennen um den
# Redeploy — der zweite Lauf wartet, statt den ersten zu überholen.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Default: nur lesen. Jeder Job erweitert genau um das, was er braucht.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Kleingeschrieben, weil OCI-Referenzen keine Grossbuchstaben zulassen —
  # `github.repository` wäre "Riddmaker/wiemeinsch.ch".
  IMAGE: ghcr.io/riddmaker/wiemeinsch.ch

jobs:
  checks:
    name: Qualität und E2E
    uses: ./.github/workflows/checks.yml

  build-push:
    name: Image bauen, publizieren, signieren
    needs: checks
    # Nur main baut und pusht. Ohne diese Bedingung schöbe ein manueller Lauf
    # auf dev ein ungeprüftes Image unter `latest` in die Registry — und
    # `latest` zieht die Umgebung bei einem Neuimport des Manifests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # GHCR-Push
      id-token: write # OIDC-Token für cosign (keyless) und die Attestation
      attestations: write # Build-Provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.3.0

      - name: An der GitHub Container Registry anmelden
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Commit-SHA ist der unveränderliche Tag — nur er wird deployt.
          # `latest` dient einzig dem Erst-Import der Umgebung per Manifest.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Bauen und pushen
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: cosign installieren
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Gepinnt: cosign 3 hat die Signatur-Defaults geändert (neues
          # Protobuf-Bundle, OCI-1.1-Referrer). Signieren und Prüfen im
          # Deploy-Job müssen dieselbe Version fahren.
          cosign-release: v3.0.6

      - name: Image signieren (keyless, GitHub-OIDC)
        # Signiert wird der Digest, nicht ein Tag: Tags sind beweglich, der
        # Digest ist der Inhalt.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Signatur sofort gegenprüfen
        # Selbstkontrolle direkt nach dem Signieren. Bricht sie, läuft der
        # Deploy-Job nicht an — besser ein roter Lauf als ein unverifizierbares
        # Image in der Registry. Der Deploy-Job prüft vor dem Redeploy noch
        # einmal, dann über den Tag, den Jelastic zieht.
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "Signatur gültig für ${IDENTITY}"

      - name: Build-Provenance attestieren
        uses: actions/attest@v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Speicher-Datensätze gibt es nur für Organisations-Repos; dieses
          # hier gehört einem Benutzerkonto.
          create-storage-record: false

  deploy:
    name: Signatur prüfen, Jelastic-Redeploy auslösen
    needs: build-push
    # Dieselben Schritte wie ein Rollback, nur mit dem frisch gebauten Digest
    # als Erwartung: Der Tag muss exakt auf das gebaute Image zeigen.
    uses: ./.github/workflows/redeploy.yml
    with:
      # Unveränderlicher Tag aus `build-push` (type=sha,format=long).
      tag: ${{ github.sha }}
      expected-digest: ${{ needs.build-push.outputs.digest }}
    # Kein `secrets: inherit`: Der Redeploy-Job liest das Token direkt aus
    # der Environment `production` — mehr braucht er nicht.
