# Lokale Umgebung — gleiche Topologie wie Prod.
# Zwei Modi (COMPOSE_PROFILES=dev in .env als Default):
#   Dev  (täglich):        docker compose up
#   Prod (vor jedem Push): docker compose --profile prod up --build
services:
  db:
    image: postgres:18 # Major gepinnt (Versions-Log); Upgrade = bewusster manueller Schritt
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres:18 nutzt /var/lib/postgresql als Volume (PGDATA liegt in .../18/docker) —
      # NICHT mehr /var/lib/postgresql/data wie bei <= 17 (am Image verifiziert, HABIT 4).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Kein Host-Port-Expose: die DB ist nur im Compose-Netz erreichbar (Least Privilege).

  # Dev-Modus: Hot Reload via Bind-Mount, node_modules bleibt im Container-Volume
  # (Windows-Bind-Mount-Performance, P1 Stolpersteine).
  app:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npx prisma generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Datei-Watching über Windows-Bind-Mounts braucht Polling.
      WATCHPACK_POLLING: "true"
      # Auth (P4) — Werte aus .env; Dev-Defaults: Mailpit + offizielle Turnstile-Dummy-Keys.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-login@wiemeinsch.local}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # AI-Services (P6) — Mistral bleibt auch lokal echt.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODERATION_MODEL: ${MISTRAL_MODERATION_MODEL:-mistral-moderation-2603}
      MISTRAL_LINTER_MODEL: ${MISTRAL_LINTER_MODEL:-mistral-medium-2604}
      MISTRAL_TRANSLATE_MODEL: ${MISTRAL_TRANSLATE_MODEL:-mistral-medium-2604}
      # Cron-Endpunkt fuer den Score-Recompute (P15.2b). Lokal leer: der
      # Endpunkt antwortet dann 404, der Recompute laeuft hier ueber
      # `npm run scores:recompute`.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Lokaler SMTP-Fänger für Magic-Link-Mails (P4): Web-UI + API auf :8025.
  mailpit:
    # Auch im Prod-Profil: der lokale Prod-Nachbau muss Magic-Link-Mails
    # abfangen können, sonst laufen die E2E-Tests dort ohne Login. In der
    # echten Zielumgebung kommt SMTP aus der Umgebung (Infomaniak, E5).
    profiles: ["dev", "prod"]
    image: axllent/mailpit
    ports:
      - "8025:8025" # UI/API für Entwickler und E2E-Tests; SMTP (1025) nur im Compose-Netz

  # Prod-Modus: baut exakt das Dockerfile, das auch die CI/CD-Pipeline fährt.
  app-prod:
    profiles: ["prod"]
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Lokale Defaults zeigen auf den Mail-Fänger bzw. die offiziellen
      # Turnstile-Testschlüssel — in der Zielumgebung setzt die Umgebung
      # diese Variablen und überschreibt die Defaults.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-login@wiemeinsch.local}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODERATION_MODEL: ${MISTRAL_MODERATION_MODEL:-mistral-moderation-2603}
      MISTRAL_LINTER_MODEL: ${MISTRAL_LINTER_MODEL:-mistral-medium-2604}
      MISTRAL_TRANSLATE_MODEL: ${MISTRAL_TRANSLATE_MODEL:-mistral-medium-2604}
      # Cron-Endpunkt fuer den Score-Recompute (P15.2b). Lokal leer: der
      # Endpunkt antwortet dann 404, der Recompute laeuft hier ueber
      # `npm run scores:recompute`.
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata: # benanntes Volume — Daten überleben `docker compose down` (nicht `down -v`)
  app_node_modules:
